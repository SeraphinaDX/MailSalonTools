name: Go CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve dependencies
        run: |
          go mod tidy
          echo '---GO.SUM START---'
          cat go.sum
          echo '---GO.SUM END---'
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v ./...
      - name: Build
        run: go build ./cmd/MailSalonTools
